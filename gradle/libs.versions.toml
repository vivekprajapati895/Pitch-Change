[versions]
agp = "8.9.1"
kotlin = "2.1.20"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.04.00"
media3 = "1.10.1"
okhttp = "4.12.0"
newpipe = "v0.26.4"
desugar = "2.1.5"
coil = "2.7.0"

[libraries]
androidx-core-ktx           = { group = "androidx.core",            name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-compose  = { group = "androidx.lifecycle",       name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }
androidx-lifecycle-viewmodel= { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose   = { group = "androidx.activity",        name = "activity-compose",            version.ref = "activityCompose" }

compose-bom                 = { group = "androidx.compose",         name = "compose-bom",                 version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",      name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",      name = "ui-graphics" }
compose-ui-tooling          = { group = "androidx.compose.ui",      name = "ui-tooling" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons      = { group = "androidx.compose.material", name = "material-icons-extended" }

media3-exoplayer            = { group = "androidx.media3", name = "media3-exoplayer",      version.ref = "media3" }
media3-exoplayer-dash       = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-hls        = { group = "androidx.media3", name = "media3-exoplayer-hls",  version.ref = "media3" }
media3-ui                   = { group = "androidx.media3", name = "media3-ui",             version.ref = "media3" }
media3-common               = { group = "androidx.media3", name = "media3-common",         version.ref = "media3" }
media3-transformer          = { group = "androidx.media3", name = "media3-transformer",    version.ref = "media3" }
media3-effect               = { group = "androidx.media3", name = "media3-effect",         version.ref = "media3" }
media3-muxer                = { group = "androidx.media3", name = "media3-muxer",          version.ref = "media3" }

okhttp                      = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
newpipe-extractor           = { group = "com.github.TeamNewPipe", name = "NewPipeExtractor", version.ref = "newpipe" }
coil-compose                = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
desugar-jdk-libs            = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
