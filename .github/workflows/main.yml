name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Debug build. Always signed with the auto-generated debug key, so the
      # APK installs on a phone without any keystore setup.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PitchPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release build. Smaller and faster, but R8 shrinking can trip over
      # NewPipeExtractor's Rhino reflection, so a failure here should not sink
      # the whole run.
      - name: Build release APK
        id: release
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PitchPlayer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
